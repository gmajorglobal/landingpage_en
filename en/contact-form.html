<section class="bg-gradient-to-r from-green_light to-blue_light" id="consultation">
  <div class="section-solutions max-w-[1280px] mx-auto px-4 lg:px-6 flex flex-col md:flex-row items-center justify-between gap-8">

    <!-- ▸ Left: white card with the form -->
    <div class="w-full md:w-1/2 bg-white rounded-3xl shadow-lg p-6">
      <h2 class="font-bold tracking-tight text-center
        [text-shadow:2px_2px_0px_rgba(0,0,0,.25)] text-xl md:text-3xl mb-6">
        Fill in for consultation
      </h2>

      <form action="https://formspree.io/f/mvgqkowy " method="POST" id="consultation-form" onsubmit="handleFormSubmit(event)">

        <input class="bg-[#FFFFF7] italic rounded-xl text-gray-800 text-sm" name="name" type="text" placeholder="Full Name" required>
        <input class="bg-[#FFFFF7] italic rounded-xl text-gray-800 text-sm" name="email" type="email" placeholder="Email" required>
        <input class="bg-[#FFFFF7] italic rounded-xl text-gray-800 text-sm" name="phone" type="tel" placeholder="Phone number" required>
        <input class="bg-[#FFFFF7] italic rounded-xl text-gray-800 text-sm" name="province" type="text" placeholder="Province/City" required>

        <p class="text-gray-700">
          By clicking the <strong>Get Free Consultation</strong> button, you agree to
          <a class="border-b border-gray-800" href="https://www.gmajor.biz/privacy-policy" target="_blank">GMAJOR's Privacy Policy</a>
        </p>

        <div class="flex justify-center items-center">
          <button type="submit" 
          class="my-4 py-2 px-6 rounded-2xl text-gray-800 font-bold text-lg bg-gradient-to-r from-blue_light to-green_light bg-[length:200%] animate-gradient-move-x">
            Get free consultation
          </button>
        </div>

        <!-- Form Loading -->
        <div id="form-loading" class="flex items-center justify-center space-x-2 hidden">
          <img class="animate-spin duration-500 w-6 h-6" src="../images/loading.png" alt="loading"/>
          <span class="text-blue-600">Sending ...</span>
        </div>

        <!-- Form Status -->
        <span id="form-status"></span>
      </form>
    </div>

    <!-- ▸ Right: headline + image -->
    <div class="w-full md:w-1/2 flex flex-col items-center justify-center">
      <h3 class="text-gray-900 text-2xl md:text-3xl font-bold mb-4 text-center">
        Fill in to receive<br>
        consultation on<br>
        <span>GMAJOR services</span>
      </h3>
      <!-- <img src="../images/megaphone-man.png" alt="Businessman with megaphone encouraging you to sign-up"> -->
      <img class="w-72 h-auto" src="./images/contact.png" alt="sign-up"/>
    </div>

  </div>
</section>
